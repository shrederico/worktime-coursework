name: worktime
services:
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      app: {condition: service_healthy}
    networks: [web]
    restart: unless-stopped
  app:
    build: .
    image: ${APP_IMAGE:-worktime:local}
    env_file: .env
    environment:
      DB_HOST: db
      DEBUG: "0"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [web, data, monitoring]
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    networks: [data]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    networks: [monitoring]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
    restart: unless-stopped
networks:
  web:
  data:
    internal: true
  monitoring:
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
