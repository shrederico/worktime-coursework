apiVersion: batch/v1
kind: Job
metadata: {name: migrate, namespace: worktime}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: worktime:local
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'python manage.py migrate --noinput && python manage.py seed_demo']
          envFrom: [{secretRef: {name: worktime-env}}]
          env: [{name: DB_HOST, value: db}]
