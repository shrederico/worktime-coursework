version: '3.8'
services:
  proxy:
    image: nginx:1.28-alpine
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    networks: [web]
  app:
    image: ${APP_IMAGE}
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
    networks: [web, data, monitoring]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 2
      update_config: {parallelism: 1, order: stop-first, failure_action: rollback, monitor: 30s}
      rollback_config: {parallelism: 1, order: stop-first}
      resources:
        limits: {memory: '${APP_MEMORY_LIMIT:-512M}'}
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [data]
    deploy:
      placement:
        constraints: [node.labels.worktime.data == true]
  prometheus:
    image: prom/prometheus:v3.5.0
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    volumes: ["prometheus_data:/prometheus"]
    networks: [monitoring]
    deploy:
      placement:
        constraints: [node.labels.worktime.data == true]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    configs:
      - source: datasource
        target: /etc/grafana/provisioning/datasources/main.yaml
      - source: dashboard_provider
        target: /etc/grafana/provisioning/dashboards/main.yaml
      - source: dashboard
        target: /var/lib/grafana/dashboards/worktime.json
    volumes: ["grafana_data:/var/lib/grafana"]
    networks: [monitoring]
    ports: ['3000:3000']
    deploy:
      placement:
        constraints: [node.labels.worktime.data == true]
configs:
  nginx: {file: ../nginx.conf, name: 'worktime_nginx_${CONFIG_VERSION}'}
  prometheus: {file: ../prometheus.yml, name: 'worktime_prometheus_${CONFIG_VERSION}'}
  datasource: {file: ../grafana/provisioning/datasources/main.yaml, name: 'worktime_datasource_${CONFIG_VERSION}'}
  dashboard_provider: {file: ../grafana/provisioning/dashboards/main.yaml, name: 'worktime_provider_${CONFIG_VERSION}'}
  dashboard: {file: ../grafana/dashboards/worktime.json, name: 'worktime_dashboard_${CONFIG_VERSION}'}
networks:
  web: {driver: overlay}
  data: {driver: overlay, internal: true, attachable: true}
  monitoring: {driver: overlay}
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
